<div
  class="grid grid-rows-[max-content_max-content_max-content] text-center content-center h-full"
>
  <div
    class="grid grid-rows-[auto_auto] content-center justify-items-center gap-8"
  >
    <span class="text-4xl">Log In</span>
    <div class="grid grid-rows-2 gap-2">
      <p-button styleClass="w-3xl" severity="primary">
        <div class="grid grid-cols-[auto_auto] justify-center gap-0.5">
          <i class="ri-microsoft-line"></i>
          <span>Microsoft</span>
        </div>
      </p-button>
      <p-button styleClass="w-3xl" (click)="login()">
        <div class="grid grid-cols-[auto_auto] justify-center gap-0.5">
          <i class="ri-github-line"></i>
          <span>GitHub</span>
        </div>
      </p-button>
    </div>
  </div>
</div>
