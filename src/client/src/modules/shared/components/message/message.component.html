<div class="message">
    <div class="message__header">
        <span class="message__title">{{ message.title }}</span>
        <tui-icon class="message__close" (click)="closed.emit(message)" icon="@tui.x"></tui-icon>
    </div>
    <div class="message__content">
        <span class="messsage__text">{{ message.message }}</span>
        <span class="message__date">{{ message.timestamp | tuiFormatDate | async }} ago</span>
    </div>
</div>
